name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create GitHub Release
      id-token: write  # npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No registry-url: setup-node would write _authToken + a dummy
          # NODE_AUTH_TOKEN, which blocks npm trusted publishing (OIDC).
          cache: npm

      # Trusted publishing (OIDC) needs npm >= 11.5; Node 22 ships 10.x.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      # No token: the registry trusts this repo + workflow via OIDC.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists, skipping"
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
